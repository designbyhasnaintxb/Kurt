# Netlify settings for the Minnesota Made Hockey (Kurt Johnson) youth hockey coaching site — plain static site, no build step
[build]
  publish = "."

# Photos and rink art rarely change: cache them for a week
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Basic security headers for every page
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
